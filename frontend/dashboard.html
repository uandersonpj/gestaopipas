<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle de Pipas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard-container {
            width: 100%;
            max-width: 900px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #004d40;
            color: white;
        }
        .metrics {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
        }
        .metric-card {
            background: #e0f2f1;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            width: 200px;
        }
        .metric-card h3 {
            margin: 0 0 10px 0;
            color: #00796b;
        }
        .metric-card p {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="app-container dashboard-container">
        <header>
            <h1>Dashboard de Apontamentos</h1>
            <a href="app.html" class="btn">Voltar para Apontamentos</a>
        </header>

        <div class="metrics">
            <div class="metric-card">
                <h3>Volume Total (m³)</h3>
                <p id="total-volume">0</p>
            </div>
            <div class="metric-card">
                <h3>Viagens Hoje</h3>
                <p id="total-viagens">0</p>
            </div>
            <div class="metric-card">
                <h3>Horas Trabalhadas</h3>
                <p id="total-horas">0</p>
            </div>
        </div>

        <h2>Histórico de Apontamentos</h2>
        <a href="#" id="export-csv" class="btn">Exportar para CSV</a>
        <table id="appointments-table">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Operador</th>
                    <th>Volume (m³)</th>
                    <th>Local Abastecido</th>
                    <th>Local Umectado</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be inserted here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // This would normally be a fetch call to the backend
            const mockAppointments = [
                { data: '2025-09-09', funcionario: 'Nerias', volume: '20000', localAbastecido: 'Água Bruta', localUmectado: 'Mina' },
                { data: '2025-09-09', funcionario: 'Ronivaldo', volume: '20000', localAbastecido: 'Estaca Zero', localUmectado: 'Acesso GO-241' },
                { data: '2025-09-09', funcionario: 'Jorge', volume: '20000', localAbastecido: 'Água Bruta', localUmectado: 'Planta Industrial' }
            ];

            const tbody = document.querySelector('#appointments-table tbody');
            const totalVolumeEl = document.getElementById('total-volume');
            const totalViagensEl = document.getElementById('total-viagens');

            let totalVolume = 0;

            mockAppointments.forEach(ap => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${ap.data}</td>
                    <td>${ap.funcionario}</td>
                    <td>${ap.volume}</td>
                    <td>${ap.localAbastecido}</td>
                    <td>${ap.localUmectado}</td>
                `;
                tbody.appendChild(row);
                totalVolume += parseInt(ap.volume, 10);
            });

            totalVolumeEl.textContent = totalVolume.toLocaleString('pt-BR');
            totalViagensEl.textContent = mockAppointments.length;

            // CSV Export logic
            document.getElementById('export-csv').addEventListener('click', () => {
                const header = "data,funcionario,volume,localAbastecido,localUmectado";
                const rows = mockAppointments.map(a => `${a.data},${a.funcionario},${a.volume},${a.localAbastecido},${a.localUmectado}`);
                const csvContent = "data:text/csv;charset=utf-8," + header + "\n" + rows.join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "apontamentos.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });
    </script>
</body>
</html>
