<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Pipas - Apontamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>PREENCHIMENTO DE DADOS</h1>
            <div class="user-info">
                <span>Operador: <span id="current-user"></span></span>
                <button id="logout-button" class="btn btn-logout">Sair</button>
            </div>
        </header>

        <div class="umectacao-controls">
            <button id="start-umectacao-btn" class="btn btn-start">Iniciar Umectação de Pista</button>
            <button id="end-umectacao-btn" class="btn btn-end" disabled>Finalizar Umectação</button>
        </div>
        <div id="umectacao-status" class="status-box" style="display:none;"></div>

        <div class="form-container">
            <div class="form-page" id="page1">
                <h3>Dados do Carregamento</h3>
                <div class="input-group">
                    <label for="funcionario">FUNCIONÁRIO</label>
                    <select id="funcionario" name="funcionario">
                        <option value="Nerias">Nerias</option>
                        <option value="Ronivaldo">Ronivaldo</option>
                        <option value="Jorge">Jorge</option>
                        <option value.="Gustavo">Gustavo</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="data">DATA</label>
                    <input type="date" id="data" name="data">
                </div>
                <div class="input-group">
                    <label for="volume">VOL. CARREGADO (M³)</label>
                    <input type="number" id="volume" name="volume" value="20000">
                </div>
                <div class="input-group">
                    <label for="horario">HORÁRIO</label>
                    <input type="time" id="horario" name="horario">
                </div>
                <div class="input-group">
                    <label>LOCAL ABASTECIDO</label>
                    <div class="radio-group">
                        <input type="radio" id="estaca-zero" name="local_abastecido" value="Estaca Zero">
                        <label for="estaca-zero">Estaca Zero</label>
                        <input type="radio" id="agua-bruta" name="local_abastecido" value="Água Bruta">
                        <label for="agua-bruta">Água Bruta</label>
                    </div>
                </div>
                <div class="input-group">
                    <label for="local-umectado">LOCAL UMECTADO</label>
                    <input type="text" id="local-umectado" name="local_umectado" placeholder="Mina, Planta, Acesso GO-241...">
                </div>
                 <div class="form-navigation">
                    <button class="btn" id="cancel-btn">Cancelar</button>
                    <button class="btn" id="next-btn">Próximo</button>
                </div>
            </div>

            <div class="form-page" id="page2" style="display:none;">
                <h3>EVIDÊNCIAS FOTOGRÁFICAS</h3>
                <div class="input-group">
                    <label for="foto-escata">FOTOS ESTACA ZERO</label>
                    <input type="file" id="foto-escata" name="foto_escata" accept="image/*" capture="camera">
                </div>
                <div class="input-group">
                    <label for="foto-bruta">FOTOS ÁGUA BRUTA</label>
                    <input type="file" id="foto-bruta" name="foto_bruta" accept="image/*" capture="camera">
                </div>
                <div class="form-navigation">
                    <button class="btn" id="prev-btn">Anterior</button>
                    <button class="btn" id="save-btn">Salvar</button>
                </div>
            </div>
        </div>
        <div id="sync-status" class="sync-status"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
